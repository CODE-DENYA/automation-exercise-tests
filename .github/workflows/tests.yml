name: UI Automated Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Проверка кода (Checkout)
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установка зависимостей Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Проверка стиля и качества кода (Ruff)
        run: ruff check .

      - name: Установка Playwright и браузеров
        run: npx playwright install --with-deps chromium

      - name: Запуск тестов (Параллельно в 2 потока)
        run: pytest -n 2 --alluredir=allure-results

      - name: Сохранение артефактов Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

      - name: Установка Java (требуется для Allure)
        uses: actions/setup-java@v5
        if: always()
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Генерация Allure Report (Node.js)
        if: always()
        run: |
          npm install -g allure-commandline --save-dev
          allure generate allure-results -o allure-report --clean

      - name: Публикация отчета на GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report