name: UI Automated Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Проверка кода (Checkout)
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установка зависимостей Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Установка Playwright и браузеров
        run: npx playwright install --with-deps chromium

      - name: Запуск тестов
        run: pytest

      - name: Сохранение артефактов Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7